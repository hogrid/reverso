# Reverso CMS Docker Compose Configuration
# Usage: docker compose up -d
#
# Variables are read from `.env` next to this file (see .env.example).
# Required:    REVERSO_COOKIE_SECRET (openssl rand -hex 32)
# Recommended: REVERSO_API_KEY (lets `reverso scan --api-url` load the schema)
#              REVERSO_COOKIE_SECURE=true once the CMS is served over HTTPS
#
# First admin: the account is claimed by whoever registers first on an empty
# database, so Reverso only allows it from the machine running the server. In
# a container every request looks remote. Set REVERSO_ALLOW_BOOTSTRAP=true in
# .env, `docker compose up -d`, register at /admin/login, then remove the
# variable and `docker compose up -d` again.
#
# Reverse proxy: set REVERSO_TRUST_PROXY=true only when nginx/Caddy/Traefik is
# in front of the container AND it overwrites client-sent X-Forwarded-* headers;
# with the port published directly (the default below) leave it false, or any
# client can spoof its IP and walk past rate limits and login lockout.

services:
  reverso:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reverso-cms
    restart: unless-stopped
    ports:
      - "${REVERSO_PORT:-3001}:3001"
    volumes:
      # Persist database and uploads
      - reverso-data:/app/.reverso
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      REVERSO_PORT: 3001
      REVERSO_HOST: 0.0.0.0
      REVERSO_DB_PATH: /app/.reverso/reverso.db
      REVERSO_COOKIE_SECRET: ${REVERSO_COOKIE_SECRET:?Cookie secret is required}
      REVERSO_API_KEY: ${REVERSO_API_KEY:-}
      REVERSO_CORS_ORIGIN: ${REVERSO_CORS_ORIGIN:-}
      REVERSO_TRUST_PROXY: ${REVERSO_TRUST_PROXY:-false}
      REVERSO_COOKIE_SECURE: ${REVERSO_COOKIE_SECURE:-auto}
      REVERSO_ALLOW_BOOTSTRAP: ${REVERSO_ALLOW_BOOTSTRAP:-false}
      REVERSO_ALLOWED_REDIRECT_DOMAINS: ${REVERSO_ALLOWED_REDIRECT_DOMAINS:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - reverso-network

  # Optional: PostgreSQL for production (provider not implemented yet; reserved)
  postgres:
    image: postgres:16-alpine
    container_name: reverso-postgres
    restart: unless-stopped
    profiles:
      - postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reverso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postgres password is required}
      POSTGRES_DB: ${POSTGRES_DB:-reverso}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reverso}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reverso-network

volumes:
  reverso-data:
    driver: local
  postgres-data:
    driver: local

networks:
  reverso-network:
    driver: bridge
