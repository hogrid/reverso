name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Publishing needs an npm token. Without it the workflow exits cleanly
  # instead of failing on every push to main.
  preflight:
    name: Check publish credentials
    runs-on: ubuntu-latest
    if: github.repository == 'hogrid/reverso'
    outputs:
      can-publish: ${{ steps.check.outputs.can-publish }}
    steps:
      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "can-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured; skipping release."
          fi

  release:
    name: Version packages / publish
    needs: preflight
    if: needs.preflight.outputs.can-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
